{% if debates %}
{% for debate in debates %}
<div class="debate-card">
    <h4>
        <a href="/debate/{{ debate.youtube_id }}">{{ debate.title }}</a>
        {% if debate.upload_date %}
        <small style="color: var(--pico-muted-color);">{{ debate.upload_date }}</small>
        {% endif %}
    </h4>
</div>
{% endfor %}
{% else %}
<article>
    <p>No debates match the current filters. Try adjusting your search criteria.</p>
</article>
{% endif %}
