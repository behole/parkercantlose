<tr>
  <td>
    <span class="{% if stance.speaker == 'parker' %}parker-label{% else %}caller-label{% endif %}">
      {{ stance.speaker | upper }}
    </span>
  </td>
  <td>
    <strong>{{ stance.label }}</strong>
  </td>
  <td>
    <meter value="{{ stance.confidence }}" min="0" max="1"
           low="0.4" high="0.7" optimum="0.9">{{ "%.0f" | format(stance.confidence * 100) }}%</meter>
    {{ "%.0f" | format(stance.confidence * 100) }}%
  </td>
  <td><small>{{ stance.evidence or '' }}</small></td>
</tr>
