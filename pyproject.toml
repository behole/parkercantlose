[project]
name = "parker-debate-pipeline"
version = "0.1.0"
description = "YouTube debate transcription and speaker diarization pipeline"
requires-python = ">=3.11"
dependencies = [
    "whisperx>=3.2.0",
    "yt-dlp",
    "sqlmodel>=0.0.22",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]

[project.scripts]
parker = "parker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parker"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/parker/models.py" = ["UP006", "UP035", "UP042", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
